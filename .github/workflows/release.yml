name: Release

# Pushing a `v*` tag builds the native libraries for every platform Cake Wallet
# ships, zips each as cw_tari_wallet-<tag>-<platform>.zip, adds the FRB Dart
# bindings and SHA256SUMS, attests them, and publishes a GitHub release. Run it by hand
# (workflow_dispatch) on a branch first: that dry run builds and packages
# everything as `dryrun` but publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Per event: a manual dry run on a tag ref must not replace a pending tag-push run.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Only a pushed v* tag publishes; a manual run is always a dry run, even on a tag.
  IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dryrun' }}
  # tari_common accepts only the networks of the group it was compiled for.
  # Mainnet group = MainNet + StageNet, chosen at runtime; one artifact per platform.
  TARI_TARGET_NETWORK: mainnet
  # Same NDK as Cake Wallet's build image (cake_wallet Dockerfile).
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  check:
    name: pre-release checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Cargo.lock has no server, CLI, gRPC or OpenSSL crates
        run: ./scripts/check_forbidden_crates.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.19.8
      # An advisory published after the commit's CI ran still blocks the release.
      - name: No known advisories
        run: cargo deny check advisories
      - name: Tag matches the crate version
        if: env.IS_TAG == 'true'
        run: |
          version="$(grep -m1 -oE '^version = "[^"]+"' Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Tagged commit is on main
        if: env.IS_TAG == 'true'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main; tag a commit on main after CI is green"
            exit 1
          fi
      - name: CI passed on the tagged commit
        # main has no branch protection, so being on main proves nothing about CI.
        # The codegen-drift check is what proves the shipped Dart bindings match the Rust.
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/require_ci_green.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

  build:
    name: build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runs-on: ubuntu-24.04
            targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          - platform: ios
            runs-on: macos-15
            targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          - platform: macos
            runs-on: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Oldest supported Ubuntu, so the .so needs only an older glibc.
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runs-on: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
          - platform: windows
            runs-on: windows-2022
            targets: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install the Android NDK
        if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Use the image's MinGW make
        if: matrix.platform == 'windows'
        # GNU make from the image's preinstalled MinGW toolchain, rather than an
        # unpinned community Chocolatey package installed as admin.
        run: |
          make_path="$(command -v mingw32-make)"
          echo "RELEASE_MAKE=$make_path" >> "$GITHUB_ENV"
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Block the network (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # A blanket outbound block would also cut the runner's own connection to
        # GitHub and fail the job, so outbound is default-deny with exceptions for
        # the runner processes, programs already connected, and DNS. Restored in the
        # always() step below.
        run: |
          Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultOutboundAction |
            ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\firewall-profiles.json"
          # Also keep every program that already holds a connection (the hosted
          # runner's provisioner and other agents), except shells and the build tools.
          $build = 'pwsh', 'powershell', 'bash', 'sh', 'cmd', 'git', 'git-remote-https',
                   'curl', 'cargo', 'rustc', 'rustup', 'make', 'svchost'
          $connected = Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue }
          $runner = @(Get-Process Runner.Listener, Runner.Worker -ErrorAction Stop) + @($connected) |
            Where-Object { $_.Path -and $build -notcontains $_.ProcessName } |
            ForEach-Object Path | Sort-Object -Unique
          Write-Output "Allowed outbound while offline:" $runner
          # Some of these are transient agent binaries the firewall rejects as a rule
          # program (e.g. a temp provisioner with an 8.3 path and no .exe suffix); skip
          # those with a warning rather than fail. The runner itself must get a rule.
          foreach ($program in $runner) {
            try {
              New-NetFirewallRule -DisplayName release-offline -Direction Outbound -Action Allow -Program $program -ErrorAction Stop | Out-Null
            } catch {
              if ($program -match '\\Runner\.(Listener|Worker)\.exe$') { throw }
              Write-Warning "Not allowed outbound while offline (rule rejected): $program ($($_.Exception.Message))"
            }
          }
          New-NetFirewallRule -DisplayName release-offline -Direction Outbound -Action Allow `
            -Program "$env:SystemRoot\System32\svchost.exe" -Protocol UDP -RemotePort 53 | Out-Null
          Set-NetFirewallProfile -All -Enabled True -DefaultOutboundAction Block
      - name: Build offline
        # Catches accidental downloads; not a security boundary against a hostile
        # build script (it runs with this user's passwordless sudo on Linux, as admin
        # on Windows, and macOS allows everything but remote connections).
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          case "$RUNNER_OS" in
            Linux)
              # Root creates a network namespace with no network (works whatever the
              # AppArmor userns policy), then drops back to this user. Variables are
              # passed by name: sudo-rs ignores a bare --preserve-env.
              keep=()
              for v in PATH HOME CARGO_HOME RUSTUP_HOME RUSTUP_TOOLCHAIN CARGO_TERM_COLOR \
                       CARGO_NET_OFFLINE TARI_TARGET_NETWORK ANDROID_HOME ANDROID_NDK_HOME; do
                if [ -n "${!v+x}" ]; then keep+=("$v=${!v}"); fi
              done
              offline=(sudo unshare --net -- sudo -u "$(id -un)" env "${keep[@]}") ;;
            macOS)
              offline=(sandbox-exec -f scripts/release/offline.sb) ;;
            *)
              # Windows: blocked by the firewall step above.
              offline=() ;;
          esac
          # Any HTTP status (even 403/503) means the network is reachable; only 000 is blocked.
          code="$("${offline[@]}" curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://index.crates.io/config.json || true)"
          if [ "$code" != 000 ]; then
            echo "::error::the offline build can still reach the internet (HTTP $code)"
            exit 1
          fi
          "${offline[@]}" ./scripts/release/build.sh "${{ matrix.platform }}" "$TAG" dist
          # For the release notes; assemble keeps it out of the release assets.
          rustc -V > "dist/rustc-${{ matrix.platform }}.txt"
      - name: Restore the network (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $saved = "$env:RUNNER_TEMP\firewall-profiles.json"
          if (Test-Path $saved) {
            foreach ($p in Get-Content $saved | ConvertFrom-Json) {
              Set-NetFirewallProfile -Name $p.Name -Enabled $p.Enabled -DefaultOutboundAction $p.DefaultOutboundAction
            }
          }
          Remove-NetFirewallRule -DisplayName release-offline -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/rustc-*.txt
          if-no-files-found: error

  assemble:
    name: assemble release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Digests publish re-checks, so a bundle swapped after this job fails there.
    outputs:
      sums-sha256: ${{ steps.digests.outputs.sums }}
      notes-sha256: ${{ steps.digests.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Tags, to find the previous release for the size delta.
          fetch-depth: 0
      # One directory per build job (no merging), so assemble.sh can check that no
      # job supplied another platform's files.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: artifacts
      - name: Check and collect the build artifacts
        # Platforms must match the build matrix.
        run: |
          ./scripts/release/assemble.sh "$TAG" artifacts dist "$RUNNER_TEMP/rustc" \
            android ios macos linux-x86_64 linux-aarch64 windows
      - name: Package the Dart bindings
        # Only the committed .dart/ files, i.e. exactly what this commit's libraries were generated with.
        run: git archive --format=zip --prefix=dart/ -o "dist/cw_tari_wallet-$TAG-dart.zip" HEAD:.dart
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=()
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            if ! gh release view "$prev_tag" --json tagName,assets > "$RUNNER_TEMP/previous.json"; then
              echo "::warning::could not read the $prev_tag release; the size report has no delta"
              jq -n --arg tag "$prev_tag" '{tagName: $tag, assets: null}' > "$RUNNER_TEMP/previous.json"
            fi
            previous=("$RUNNER_TEMP/previous.json")
          fi
          python3 scripts/release/release_notes.py "$TAG" "$GITHUB_SHA" "$RUNNER_TEMP/rustc" dist "${previous[@]}" > release-notes.md
          # The summary page, not the log: a line in the notes cannot act as a workflow command.
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Bundle digests
        id: digests
        run: |
          echo "sums=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "notes=$(sha256sum release-notes.md | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  # The only job with a write token, and only on a pushed v* tag. Runs in the
  # `release` environment so required reviewers can gate it (see CONTRIBUTING.md).
  publish:
    name: publish release
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundle
          path: bundle
      - name: Bundle is what assemble produced
        env:
          SUMS_SHA256: ${{ needs.assemble.outputs.sums-sha256 }}
          NOTES_SHA256: ${{ needs.assemble.outputs.notes-sha256 }}
        run: |
          cd bundle
          echo "$SUMS_SHA256  dist/SHA256SUMS" | sha256sum -c -
          echo "$NOTES_SHA256  release-notes.md" | sha256sum -c -
          cd dist
          sha256sum -c --strict SHA256SUMS
          # Every file gh release create uploads must be listed in SHA256SUMS.
          expected="$( (cut -d' ' -f3- SHA256SUMS; echo SHA256SUMS) | LC_ALL=C sort)"
          if [ "$(find . -mindepth 1 | sed 's|^\./||' | LC_ALL=C sort)" != "$expected" ]; then
            echo "::error::bundle/dist holds files not listed in SHA256SUMS"
            exit 1
          fi
      # Narrows, but does not close, the window for moving the tag; the v* tag
      # ruleset and immutable releases close it (see CONTRIBUTING.md).
      - name: Tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          if [ "$type" = tag ]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now points at $sha, not the built commit $GITHUB_SHA"
            exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bundle/dist/*.zip
            bundle/dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" bundle/dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file bundle/release-notes.md
