# ---------------------------------------------------------------------------
# Workspace
# ---------------------------------------------------------------------------
# The bridge library is the root crate; `verify/` is an in-repo workspace member
# that holds the end-to-end verification harness. Keeping the harness
# as a workspace member (rather than the old sibling `cw-tests` repo) means it is
# built/tested by this repo's CI, shares the *same* dependency resolution as the
# library (no divergent `tari_common_types` git pin), and cannot drift from the
# public API it exercises.
#
# `make gen` (flutter_rust_bridge codegen) targets `crate::api` of THIS crate and
# is unaffected by the workspace: `flutter_rust_bridge.yaml` paths are relative to
# the repo root, and the root remains the bridge library with the same
# `crate-type`.
[workspace]
members = [".", "verify"]

[package]
name = "minotari_wallet_ffi"
version = "0.3.0"
edition = "2021"
# This crate is a Flutter <-> Rust bridge library and is never published to a
# public registry. Marking it private lets `cargo deny check licenses` skip it
# (see `[licenses.private]` in deny.toml).
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
fern = { version = "0.7.1", features = ["meta-logging-in-format"] }
file-rotate = "0.8.0"
flutter_rust_bridge = "=2.11.1"
log = { version = "0.4.29", features = ["kv"] }
minotari-wallet = { package = "minotari-wallet-core", git = "https://github.com/tari-project/minotari-cli.git", rev = "80e8ac9a122ecb1c4c04f60d2b650206cf20e93c", default-features = false, features = ["http"] }
once_cell = "1.21.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.36.0"
rand = "0.10"
tari_common = { version = "=6.3.0-pre.4" }
tari_common_types = { version = "=6.3.0-pre.4" }
tari_crypto = "=0.24.1"
tari_hashing = { version = "=6.3.0-pre.4" }
tari_transaction_components = { version = "=6.3.0-pre.4" }
tari_utilities = "=0.10.0"
thiserror = "2.0.17"
threadpool = "1.8.1"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
uuid = "1.19.0"
zeroize = "1"

# Release artifacts shipped to Cake Wallet. `panic` stays at the default "unwind":
# FRB turns Rust panics into Dart exceptions via `catch_unwind`, which "abort" would
# replace with a crash of the whole app. opt-level stays 3 until a device benchmark
# shows "s" does not slow scanning.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
