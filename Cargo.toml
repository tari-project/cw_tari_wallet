[package]
name = "rust_lib_flutter_rust_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
fern = "0.7.1"
file-rotate = "0.8.0"
flutter_rust_bridge = "=2.11.1"
log = { version = "0.4.29", features = ["kv"] }
minotari-wallet = { package = "minotari", git = "https://github.com/tari-project/minotari-cli.git", rev = "aaa6ae428f35c99d642970dec0c02d6538de7dc1" }
once_cell = "1.21.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
tari_common = { git = "https://github.com/tari-project/tari.git", rev = "766f80ccc20596413ee208311750c11e02a2841d" }
tari_common_types = { git = "https://github.com/tari-project/tari.git", rev = "766f80ccc20596413ee208311750c11e02a2841d" }
tari_crypto = "0.22.1"
tari_transaction_components = { git = "https://github.com/tari-project/tari.git", rev = "766f80ccc20596413ee208311750c11e02a2841d" }
tari_utilities = "0.8.0"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
uuid = "1.19.0"
zeroize = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
